name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      REDIS_PASSWORD: ci
      MONGO_USER: ci
      MONGO_PASSWORD: ci
      MONGO_DB: ci
      ELASTIC_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npx jest --coverage --all
